name: tirithgate

on: pull_request

# Note: this is "pull_request", not "pull_request_target".
# The second one runs with write access and your secrets against code from the
# pull request, which is how repos get taken over. Do not switch it.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed. Without the full history, git cannot work out where this
          # branch split off from the base, and the check has nothing to compare.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pinned to a version range on purpose. Bare 'npx tirithgate' pulls
      # whatever is newest at the moment the job runs, which means a release
      # you did not ask for can change what your pull requests are checked
      # against. Bump this deliberately.
      #
      # This checks the finished pull request. It does not run 'plan check',
      # which belongs earlier: the plan has to be right before the agents
      # start, not after they have already written the code.
      - run: npx tirithgate@0.1 check --base "${{ github.base_ref }}"
        env:
          TIRITHGATE_PR_BODY: ${{ github.event.pull_request.body }}
